[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "offerroom"
version = "0.1.0"
description = "Your job hunt, run by a team of AI agents in one chat room (Switch + MCP)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pypdf>=4", "fpdf2>=2.7", "python-docx>=1.1", "mcp>=1.2"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
offerroom = "offerroom.cli:main"
offerroom-mcp = "offerroom.server:main"

[tool.setuptools]
packages = ["offerroom"]

[tool.setuptools.package-data]
offerroom = ["samples/*.json"]
